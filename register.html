<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | LocalJobHub</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">◉</span><span><b>Local<span>JobHub</span></b><small>Local Jobs · Trusted Consultancy</small></span></a><a href="index.html">← Home</a></div></header>
<main class="auth-wrap"><section class="auth-card wide"><h1>Create your LocalJobHub account</h1><p>Choose what you want to do on LocalJobHub.</p>
<div class="role-choice"><button class="choice active" data-register-role="seeker"><b>👨‍💼 I Want a Job</b><small>Search and apply for local jobs</small></button><button class="choice" data-register-role="employer"><b>🏢 I Want to Hire</b><small>Post jobs and manage applications</small></button></div>
<form id="registerForm"><input type="hidden" id="registerRole" value="seeker"><div class="two-col"><label>Full Name / Company Name<input required id="regName"></label><label>Email<input required type="email" id="regEmail"></label><label>Mobile Number<input required type="tel" id="regMobile"></label><label>Location<input required id="regLocation" placeholder="Siliguri"></label><label>Password<input required type="password" id="regPassword" minlength="6"></label><label>Confirm Password<input required type="password" id="regConfirm"></label></div>
<div id="seekerFields"><label>Skills<input placeholder="Computer, Sales, Driving..."></label><label>Qualification<input placeholder="10th / 12th / Graduate..."></label><label>Experience<input placeholder="Fresher / 2 years..."></label></div>
<div id="employerFields" class="hidden"><label>Company Details<textarea placeholder="Tell job seekers about your company"></textarea></label></div>
<button class="btn btn-primary full">Create Account</button></form><p class="auth-bottom">Already registered? <a href="login.html">Login</a></p></section></main><script src="js/app.js"></script></body></html>
