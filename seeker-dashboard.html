<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Seeker Dashboard | LocalJobHub</title><link rel="stylesheet" href="style.css?v=20260922"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body class="dashboard-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">◉</span><span><b>Local<span>JobHub</span></b><small>Job Seeker Workspace</small></span></a><a class="btn btn-outline" href="index.html">Find Jobs</a></div></header>
<main class="dashboard-shell"><div class="dashboard-top"><div><h1>Job Seeker Dashboard</h1><p>Track applications and saved opportunities.</p></div><div class="top-actions"><span class="admin-badge">JOB SEEKER</span><button class="btn btn-outline" onclick="logout()">Logout</button></div></div>
<div class="dashboard-layout"><aside class="dashboard-sidebar"><h3>My Account</h3><button class="dash-link active" onclick="scrollToId('overview')">▦ Overview</button><button class="dash-link" onclick="scrollToId('applicationsPanel')">▤ My Applications</button><button class="dash-link" onclick="scrollToId('savedPanel')">♡ Saved Jobs</button><a class="dash-link" href="index.html#jobs">⌕ Find Jobs</a></aside>
<main class="dashboard-main"><section id="overview" class="stats-row"><div class="stat-card"><b id="applied">0</b><span>Applied</span></div><div class="stat-card"><b id="shortlisted">0</b><span>Shortlisted</span></div><div class="stat-card"><b id="interview">0</b><span>Interview</span></div><div class="stat-card"><b id="selected">0</b><span>Selected</span></div></section>
<section class="dashboard-card" id="applicationsPanel"><div class="dashboard-card-head"><h2>My Applications</h2><a class="btn btn-outline" href="index.html#jobs">Find More Jobs</a></div><div id="applications" class="dashboard-table-list">Loading...</div></section>
<section class="dashboard-card" id="savedPanel"><div class="dashboard-card-head"><h2>Saved Jobs</h2></div><div id="saved" class="dashboard-table-list">Loading...</div></section></main></div></main>
<script>
const sb=window.LocalJobHubSupabase;let me=null;
async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u){location.href='login.html';return}me=u;const p=(await sb.from('profiles').select('role').eq('id',u.id).single()).data;if(p?.role!=='seeker'){location.href='index.html';return}loadApplications();loadSaved()}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
async function loadApplications(){const {data,error}=await sb.from('job_applications').select('*,jobs(title,company,location)').eq('seeker_id',me.id).order('created_at',{ascending:false});if(error){applications.innerHTML='<div class="error-message">'+esc(error.message)+'</div>';return}applied.textContent=data.length;shortlisted.textContent=data.filter(x=>x.status==='shortlisted').length;interview.textContent=data.filter(x=>x.status==='interview').length;selected.textContent=data.filter(x=>x.status==='selected').length;applications.innerHTML=data.map(a=>'<div class="job-row"><div><h3>'+esc(a.jobs?.title)+'</h3><p>'+esc(a.jobs?.company)+' · '+esc(a.jobs?.location)+'</p></div><span class="status-pill '+esc(a.status)+'">'+esc(a.status)+'</span></div>').join('')||'<div class="notice">You have not applied for any job yet.</div>'}
async function loadSaved(){const {data,error}=await sb.from('saved_jobs').select('*,jobs(title,company,location)').eq('seeker_id',me.id).order('created_at',{ascending:false});if(error){saved.innerHTML='<div class="error-message">'+esc(error.message)+'</div>';return}saved.innerHTML=data.map(x=>'<div class="job-row"><div><h3>'+esc(x.jobs?.title)+'</h3><p>'+esc(x.jobs?.company)+' · '+esc(x.jobs?.location)+'</p></div><a class="btn btn-outline" href="index.html#jobs">View Jobs</a></div>').join('')||'<div class="notice">No saved jobs yet.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function logout(){await sb.auth.signOut();location.href='index.html'}boot();
</script></body></html>
