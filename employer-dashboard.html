<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employer Dashboard | LocalJobHub</title><link rel="stylesheet" href="css/style.css"></head>
<body class="dashboard-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">◉</span><span><b>Local<span>JobHub</span></b><small>Employer Dashboard</small></span></a><a href="index.html">View Website</a></div></header>
<div class="dashboard container"><aside class="dashboard-sidebar"><h3>Employer</h3><button class="dash-link active">▦ Dashboard</button><button class="dash-link" data-panel="postJob">＋ Post New Job</button><button class="dash-link">▤ My Jobs</button><button class="dash-link">♧ Applications</button><button class="dash-link">♙ Candidate Profiles</button><button class="dash-link">⚙ Company Profile</button><button class="dash-link">⇥ Logout</button></aside>
<main class="dashboard-main"><h1>Employer Dashboard</h1><div class="stats-row"><div><b>12</b><span>Active Jobs</span></div><div><b>84</b><span>Applications</span></div><div><b>19</b><span>Shortlisted</span></div><div><b>6</b><span>Interviews</span></div></div>
<section class="panel" id="postJob"><h2>Post a New Job</h2><form id="postJobForm"><div class="two-col"><label>Job Title<input required placeholder="e.g. Computer Operator"></label><label>Category<select><option>Computer</option><option>Security</option><option>Delivery</option><option>Retail</option><option>Technician</option></select></label><label>Location<input required value="Siliguri"></label><label>Salary<input placeholder="₹12,000 - ₹18,000"></label><label>Job Type<select><option>Full Time</option><option>Part Time</option><option>Contract</option></select></label><label>Experience<input placeholder="0-2 years"></label><label>Qualification<input placeholder="12th / Graduate"></label><label>Deadline<input type="date"></label></div><label>Required Skills<input placeholder="MS Office, communication, basic computer"></label><label>Job Description<textarea required rows="5"></textarea></label><button class="btn btn-primary">Publish Job</button></form></section>
<section class="panel"><h2>Recent Applications</h2><div class="table-scroll"><table><tr><th>Candidate</th><th>Job</th><th>Location</th><th>Status</th></tr><tr><td>Rahul Das</td><td>Security Guard</td><td>Siliguri</td><td><span class="status">Shortlisted</span></td></tr><tr><td>Priya Sharma</td><td>Receptionist</td><td>Matigara</td><td><span class="status">Applied</span></td></tr></table></div></section></main></div><script src="js/app.js"></script></body></html>
