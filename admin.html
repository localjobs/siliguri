<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | LocalJobHub</title><link rel="stylesheet" href="style.css?v=20260922"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body class="dashboard-page">
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">◉</span><span><b>Local<span>JobHub</span></b><small>Administration</small></span></a><div class="top-actions"><span class="admin-badge">ADMIN</span><button id="logoutBtn" class="btn btn-outline" type="button">Logout</button></div></div></header>
<main class="dashboard-shell"><div class="admin-hero"><h1>Job Approval Center</h1><p>Review employer submissions before they appear as LocalJobHub jobs.</p></div>
<div class="dashboard-layout"><aside class="dashboard-sidebar"><h3>Admin</h3><button class="dash-link active" data-status="pending">⏳ Pending Jobs</button><button class="dash-link" data-status="approved">✓ Approved Jobs</button><button class="dash-link" data-status="rejected">✕ Rejected Jobs</button><button class="dash-link" data-status="disabled">⊘ Disabled Jobs</button><button class="dash-link" data-status="all">▦ All Jobs</button><button class="dash-link" id="refreshBtn">↻ Refresh</button></aside>
<main class="dashboard-main"><section class="dashboard-card"><div class="admin-filters"><label>Search<input id="q" placeholder="Title, employer, location, category"></label><label>Status<select id="status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="disabled">Disabled</option><option value="all">All</option></select></label></div><div id="jobsList">Loading...</div></section></main></div></main>
<script>
const sb=window.LocalJobHubSupabase;let jobs=[];const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u){location.href="login.html";return}const p=(await sb.from("profiles").select("role").eq("id",u.id).maybeSingle()).data;if(p?.role!=="admin"){alert("Admin access required.");location.href="index.html";return}await loadJobs()}
async function loadJobs(){const r=await sb.from("jobs").select("*").order("created_at",{ascending:false});if(r.error){jobsList.innerHTML='<div class="error-message">'+esc(r.error.message)+"</div>";return}jobs=r.data||[];filterJobs()}
function filterJobs(){const q=document.querySelector("#q").value.toLowerCase().trim(),s=document.querySelector("#status").value;const list=jobs.filter(j=>(s==="all"||j.status===s)&&(!q||(j.title+" "+j.company+" "+j.location+" "+(j.category||"")).toLowerCase().includes(q)));jobsList.innerHTML=list.length?list.map(j=>'<article class="admin-job"><div class="admin-job-head"><div><h2>'+esc(j.title)+'</h2><div class="admin-job-meta">'+esc(j.company)+" · "+esc(j.location)+" · "+esc(j.category||"")+'</div></div><span class="status-pill '+esc(j.status)+'">'+esc(j.status)+'</span></div><div class="admin-job-meta">'+esc(j.salary||"Salary not disclosed")+" · "+esc(j.type||"Full Time")+" · "+esc(j.experience||"")+'</div><p class="admin-job-description">'+esc(j.description||"No description provided.")+'</p>'+(j.rejection_reason?'<p class="error-message"><b>Rejection reason:</b> '+esc(j.rejection_reason)+"</p>":"")+'<div class="admin-actions"><button class="btn btn-primary" data-action="approve" data-id="'+j.id+'" '+(j.status==="approved"?"disabled":"")+'>Approve</button><button class="btn btn-outline" data-action="reject" data-id="'+j.id+'" '+(j.status==="rejected"?"disabled":"")+'>Reject</button><button class="btn btn-outline" data-action="disable" data-id="'+j.id+'" '+(j.status==="disabled"?"disabled":"")+'>Disable</button><button class="btn btn-danger" data-action="delete" data-id="'+j.id+'">Delete</button></div></article>').join(""):'<div class="admin-empty">No jobs match this filter.</div>'}
document.querySelector("#q").addEventListener("input",filterJobs);document.querySelector("#status").addEventListener("change",filterJobs);document.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click",()=>{document.querySelector("#status").value=b.dataset.status;filterJobs()}));document.querySelector("#refreshBtn").addEventListener("click",loadJobs);
document.querySelector("#jobsList").addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.id,a=b.dataset.action;if(a==="approve"){const u=(await sb.auth.getUser()).data.user;const r=await sb.from("jobs").update({status:"approved",approved_by:u.id,approved_at:new Date().toISOString(),rejection_reason:null}).eq("id",id);if(r.error)alert(r.error.message)}else if(a==="reject"){const reason=prompt("Reason for rejecting this job:");if(reason===null)return;if(!reason.trim()){alert("Please enter a rejection reason.");return}const r=await sb.from("jobs").update({status:"rejected",rejection_reason:reason.trim()}).eq("id",id);if(r.error)alert(r.error.message)}else if(a==="disable"){if(!confirm("Disable this job from public listings?"))return;const r=await sb.from("jobs").update({status:"disabled"}).eq("id",id);if(r.error)alert(r.error.message)}else if(a==="delete"){if(!confirm("Delete this job permanently?"))return;const r=await sb.from("jobs").delete().eq("id",id);if(r.error)alert(r.error.message)}await loadJobs()});
document.querySelector("#logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();location.href="index.html"});boot();
</script></body></html>
